<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">覆盖治理投影只暴露信号，治理决定由人作出并回写事实源</title>
  <desc id="desc">原始记录经过状态投影和覆盖汇总，形成待治理清单；人工复核后把决定写回原始记录。覆盖汇总不会自动修改事实源。</desc>
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3a9d72"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="82" fill="#19232d" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700">覆盖治理投影不是第二份事实库</text>
  <text x="80" y="128" fill="#566473" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25">它集中暴露缺口与待治理信号，但不会替人作决定</text>

  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="75" y="220" width="320" height="390" rx="14" fill="#ffffff" stroke="#9dabb6" stroke-width="3"/>
    <text x="110" y="278" fill="#19232d" font-size="31" font-weight="700">1. 原始记录</text>
    <text x="110" y="320" fill="#4e5d6b" font-size="22">保留正文、历史与证据</text>
    <rect x="110" y="365" width="250" height="60" rx="8" fill="#dceaf3"/>
    <text x="132" y="403" fill="#22313d" font-size="22">现行规则与范围</text>
    <rect x="110" y="445" width="250" height="60" rx="8" fill="#fbecc8"/>
    <text x="132" y="483" fill="#22313d" font-size="22">冲突与待验证观察</text>
    <rect x="110" y="525" width="250" height="60" rx="8" fill="#e3e8ec"/>
    <text x="132" y="563" fill="#22313d" font-size="22">来源、审查日期、负责人</text>

    <rect x="465" y="220" width="300" height="390" rx="14" fill="#ffffff" stroke="#9dabb6" stroke-width="3"/>
    <text x="500" y="278" fill="#19232d" font-size="31" font-weight="700">2. 状态投影</text>
    <text x="500" y="320" fill="#4e5d6b" font-size="22">逐条声明当前行动地位</text>
    <rect x="500" y="365" width="230" height="55" rx="8" fill="#dcefe5"/>
    <text x="523" y="401" fill="#22313d" font-size="22">active · 可执行</text>
    <rect x="500" y="440" width="230" height="55" rx="8" fill="#fbecc8"/>
    <text x="523" y="476" fill="#22313d" font-size="22">pending · 待验证</text>
    <rect x="500" y="515" width="230" height="55" rx="8" fill="#f6dadd"/>
    <text x="523" y="551" fill="#22313d" font-size="22">conflict · 暂停</text>

    <rect x="835" y="220" width="300" height="390" rx="14" fill="#ffffff" stroke="#9dabb6" stroke-width="3"/>
    <text x="870" y="278" fill="#19232d" font-size="31" font-weight="700">3. 覆盖汇总</text>
    <text x="870" y="320" fill="#4e5d6b" font-size="22">按主题与范围暴露信号</text>
    <rect x="870" y="365" width="230" height="55" rx="8" fill="#fbecc8"/>
    <text x="893" y="401" fill="#22313d" font-size="22">覆盖缺口</text>
    <rect x="870" y="440" width="230" height="55" rx="8" fill="#f6dadd"/>
    <text x="893" y="476" fill="#22313d" font-size="22">冲突、逾期</text>
    <rect x="870" y="515" width="230" height="55" rx="8" fill="#dceaf3"/>
    <text x="893" y="551" fill="#22313d" font-size="22">缺负责人、范围边界</text>

    <rect x="1205" y="220" width="320" height="390" rx="14" fill="#ffffff" stroke="#9dabb6" stroke-width="3"/>
    <text x="1240" y="278" fill="#19232d" font-size="31" font-weight="700">4. Human Gate</text>
    <text x="1240" y="320" fill="#4e5d6b" font-size="22">具名复核并作出决定</text>
    <rect x="1240" y="365" width="250" height="60" rx="8" fill="#dcefe5"/>
    <text x="1262" y="403" fill="#22313d" font-size="22">确认是否填补缺口</text>
    <rect x="1240" y="445" width="250" height="60" rx="8" fill="#dcefe5"/>
    <text x="1262" y="483" fill="#22313d" font-size="22">解决冲突或安排复验</text>
    <rect x="1240" y="525" width="250" height="60" rx="8" fill="#dcefe5"/>
    <text x="1262" y="563" fill="#22313d" font-size="22">把决定写回事实源</text>

    <path d="M409 393 L451 414 L409 435 Z" fill="#71808d"/>
    <path d="M779 393 L821 414 L779 435 Z" fill="#71808d"/>
    <path d="M1149 393 L1191 414 L1149 435 Z" fill="#71808d"/>

    <path d="M1365 635 C1365 760, 235 760, 235 635" fill="none" stroke="#3a9d72" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrow-green)"/>
    <text x="605" y="690" fill="#2d7f5c" font-size="24" font-weight="600">人工决定回写原始记录，再重新生成投影</text>
    <text x="505" y="825" fill="#6a4c1e" font-size="24" font-weight="600">覆盖汇总只提醒，不自动创建、续期、选边、晋升或分配负责人</text>
  </g>
</svg>
