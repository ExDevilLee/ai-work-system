<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">重复做法怎样成为程序性记忆</title>
  <desc id="desc">一次观察先保留，重复出现后形成包含范围、来源、停止条件和人工决定的候选契约。经过变体复测和人工 Review 后，按复杂度选择 Rule、Guide、Skill 或 Workflow。发布后继续观察，并允许降级、替代和撤销。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#657581"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#2f805d"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f4f6f8"/>
  <g font-family="Hiragino Sans GB, Heiti SC, Arial Unicode MS, sans-serif">
    <text x="80" y="78" fill="#17232d" font-size="44" font-weight="700">重复做法怎样成为程序性记忆</text>
    <text x="80" y="122" fill="#536472" font-size="24">先验证行为契约，再选择最小载体；Rule、Guide、Skill、Workflow 不是自动升级阶梯</text>

    <rect x="70" y="195" width="300" height="350" rx="16" fill="#ffffff" stroke="#9aa9b4" stroke-width="3"/>
    <circle cx="118" cy="248" r="25" fill="#263744"/><text x="109" y="258" fill="#ffffff" font-size="22" font-weight="700">1</text>
    <text x="160" y="258" fill="#17232d" font-size="29" font-weight="700">原始观察</text>
    <text x="105" y="318" fill="#435561" font-size="22">一次成功或失败</text>
    <text x="105" y="356" fill="#435561" font-size="22">保留任务、来源与例外</text>
    <rect x="105" y="405" width="230" height="66" rx="10" fill="#fbe9bf"/><text x="143" y="447" fill="#664a1d" font-size="22" font-weight="600">先不写成规则</text>
    <text x="105" y="510" fill="#667681" font-size="19">观察 ≠ 已批准记忆</text>

    <line x1="382" y1="370" x2="424" y2="370" stroke="#657581" stroke-width="5"/><polygon points="424,370 411,362 411,378" fill="#657581"/>
    <rect x="440" y="160" width="365" height="420" rx="16" fill="#ffffff" stroke="#9aa9b4" stroke-width="3"/>
    <circle cx="490" cy="215" r="25" fill="#263744"/><text x="481" y="225" fill="#ffffff" font-size="22" font-weight="700">2</text>
    <text x="532" y="225" fill="#17232d" font-size="29" font-weight="700">候选行为契约</text>
    <rect x="480" y="270" width="285" height="54" rx="9" fill="#dceaf3"/><text x="505" y="305" fill="#21343f" font-size="21">范围：只适用于哪里</text>
    <rect x="480" y="338" width="285" height="54" rx="9" fill="#dceaf3"/><text x="505" y="373" fill="#21343f" font-size="21">来源：判断回到哪里</text>
    <rect x="480" y="406" width="285" height="54" rx="9" fill="#f7d9dc"/><text x="505" y="441" fill="#693b42" font-size="21">停止：失败时不继续</text>
    <rect x="480" y="474" width="285" height="64" rx="9" fill="#dcefe5"/><text x="505" y="514" fill="#245e47" font-size="21" font-weight="600">Human Gate：人来决定</text>

    <line x1="817" y1="370" x2="859" y2="370" stroke="#657581" stroke-width="5"/><polygon points="859,370 846,362 846,378" fill="#657581"/>
    <rect x="875" y="195" width="300" height="350" rx="16" fill="#ffffff" stroke="#9aa9b4" stroke-width="3"/>
    <circle cx="923" cy="248" r="25" fill="#263744"/><text x="914" y="258" fill="#ffffff" font-size="22" font-weight="700">3</text>
    <text x="965" y="258" fill="#17232d" font-size="29" font-weight="700">复测与 Review</text>
    <text x="910" y="318" fill="#435561" font-size="22">用语义等价变体复测</text>
    <text x="910" y="356" fill="#435561" font-size="22">保留失败和例外</text>
    <text x="910" y="394" fill="#435561" font-size="22">人工判断是否晋升</text>
    <rect x="910" y="435" width="230" height="66" rx="10" fill="#dcefe5"/><text x="950" y="477" fill="#245e47" font-size="22" font-weight="600">通过才选择载体</text>

    <line x1="1187" y1="370" x2="1229" y2="370" stroke="#657581" stroke-width="5"/><polygon points="1229,370 1216,362 1216,378" fill="#657581"/>
    <rect x="1245" y="145" width="285" height="450" rx="16" fill="#ffffff" stroke="#9aa9b4" stroke-width="3"/>
    <circle cx="1293" cy="200" r="25" fill="#263744"/><text x="1284" y="210" fill="#ffffff" font-size="22" font-weight="700">4</text>
    <text x="1335" y="210" fill="#17232d" font-size="29" font-weight="700">选择最小载体</text>
    <rect x="1280" y="254" width="130" height="58" rx="9" fill="#e3e8ec"/><text x="1315" y="291" fill="#21343f" font-size="22" font-weight="700">Rule</text><text x="1430" y="291" fill="#536472" font-size="20">边界</text>
    <rect x="1280" y="326" width="130" height="58" rx="9" fill="#dceaf3"/><text x="1300" y="363" fill="#21343f" font-size="22" font-weight="700">Guide</text><text x="1430" y="363" fill="#536472" font-size="20">解释</text>
    <rect x="1280" y="398" width="130" height="58" rx="9" fill="#fbe9bf"/><text x="1308" y="435" fill="#21343f" font-size="22" font-weight="700">Skill</text><text x="1430" y="435" fill="#536472" font-size="20">执行</text>
    <rect x="1280" y="470" width="130" height="58" rx="9" fill="#dcefe5"/><text x="1288" y="507" fill="#21343f" font-size="21" font-weight="700">Workflow</text><text x="1430" y="507" fill="#536472" font-size="20">状态</text>
    <text x="1280" y="565" fill="#536472" font-size="18">按需要选择，不是逐级升级</text>

    <line x1="1385" y1="620" x2="1385" y2="650" stroke="#2f805d" stroke-width="5" stroke-dasharray="12 10"/>
    <line x1="1385" y1="650" x2="285" y2="650" stroke="#2f805d" stroke-width="5" stroke-dasharray="12 10"/>
    <line x1="285" y1="650" x2="285" y2="575" stroke="#2f805d" stroke-width="5" stroke-dasharray="12 10"/>
    <polygon points="285,575 277,590 293,590" fill="#2f805d"/>
    <rect x="450" y="675" width="700" height="112" rx="14" fill="#dff1e8" stroke="#2f805d" stroke-width="3"/>
    <text x="505" y="721" fill="#245e47" font-size="26" font-weight="700">5. 发布后继续观察</text>
    <text x="505" y="758" fill="#356b55" font-size="21">版本化 · 复核 · 范围收窄 · 降级 · 替代 · 撤销</text>

    <rect x="220" y="855" width="1160" height="68" rx="10" fill="#263744"/>
    <text x="335" y="898" fill="#ffffff" font-size="24" font-weight="600">不能停止、不能撤销的自动化，不应被当作成熟的程序性记忆</text>
  </g>
</svg>
